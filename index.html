<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AiJ Labs — Advanced AI Solutions</title>
<meta name="description" content="AiJ Labs: soluciones de inteligencia artificial avanzadas, escalables y centradas en las personas." />
<style>
  :root {
    --navy-deep: #0b2545;
    --navy: #123a6b;
    --blue: #2f6fd6;
    --blue-light: #a9c9f0;
    --ink: #1c2b3a;
    --muted: #5b6b7c;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .dots {
    position: absolute;
    width: 140px;
    height: 90px;
    background-image: radial-gradient(var(--blue) 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    opacity: 0.35;
  }
  .dots.top-left { top: 3rem; left: 3rem; }
  .dots.top-right { top: 3rem; right: 3rem; }
  .logo {
    max-width: 480px;
    width: 90%;
    margin-bottom: 1rem;
  }
  .tagline {
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    color: var(--blue);
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-size: 1rem;
    color: var(--muted);
    max-width: 560px;
    margin: 1.5rem auto 0;
    line-height: 1.6;
  }
  .badge {
    margin-top: 2.5rem;
    padding: 0.6rem 1.4rem;
    border: 1px solid var(--blue-light);
    border-radius: 999px;
    font-size: 0.85rem;
    color: var(--navy);
    background: rgba(47, 111, 214, 0.06);
  }
  .waves {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    line-height: 0;
    z-index: -1;
  }
  .contact {
    position: absolute;
    bottom: 2rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .contact a { color: var(--navy); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="hero">
    <div class="dots top-left"></div>
    <div class="dots top-right"></div>

    <img src="/logo.png" alt="AiJ Labs" class="logo" />
    <p class="tagline">Intelligent. Scalable. Human-Centered.</p>
    <p class="subtitle">
      Estamos construyendo nuestro nuevo sitio institucional.
      Muy pronto vas a poder conocer todas nuestras soluciones de inteligencia artificial aplicada.
    </p>
    <div class="badge">Próximamente</div>

    <div class="contact">
      Contacto: <a href="mailto:aijlabs.ia@gmail.com">aijlabs.ia@gmail.com</a>
    </div>

    <svg class="waves" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path fill="#a9c9f0" fill-opacity="0.5" d="M0,120 C240,200 480,40 720,90 C960,140 1200,60 1440,110 L1440,220 L0,220 Z"></path>
      <path fill="#123a6b" d="M0,160 C240,90 480,220 720,150 C960,80 1200,190 1440,140 L1440,220 L0,220 Z"></path>
    </svg>
  </div>
</body>
</html>
